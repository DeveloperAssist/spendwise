[project]
name = "spendwise"
version = "2.0.0"
description = "SpendWise API: a multi-user UPI expense tracker with an AI money assistant (FastAPI, SQLModel, PostgreSQL, Groq)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Developers Assist" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "groq>=0.11",
    "psycopg[binary]>=3.2",
]

[project.scripts]
spendwise = "spendwise.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]          # assert in tests; FastAPI's Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "E501"]       # test passwords; long assert lines
